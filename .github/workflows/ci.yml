name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The suite exercises auth-enforced endpoints and localhost/private
      # targets. A clean runner has no .env, where these settings default to
      # auth_required=true / allow_private_targets=false, which would make
      # integration tests fail. Set the test-environment values explicitly.
      AUTH_REQUIRED: "false"
      ALLOW_LOCALHOST_TARGETS: "true"
      ALLOW_PRIVATE_TARGETS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ensure default database directory exists
        run: mkdir -p data
      - name: Run tests
        run: pytest app/tests tests -q

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.15.5
      - name: Lint
        run: ruff check app tests conftest.py

  frontend-build:
    name: Frontend test + build (vitest + tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
