server:
  port: 8001

spring:
  application:
    name: financebot

  datasource:
    url: jdbc:h2:mem:meridiandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:change-me}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${TARGET_MODEL:${OPENAI_MODEL:gpt-4o}}

logging:
  level:
    com.meridianbank: INFO
    org.springframework.ai: WARN
